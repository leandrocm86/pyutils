[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyutils"
version = "0.4.0"
description = "Personal utility python modules"
requires-python = ">=3.15"

[tool.hatch.build.targets.wheel]
packages = ["utils", "std"]
include = ["utils/py.typed", "std/py.typed"]

[tool.pyright]
exclude = ["tests"]

[tool.ty.src]
exclude = ["**/tests"]
